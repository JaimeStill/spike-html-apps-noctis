# pnpm's settings for the install (mise run install); the repository is one package, so it lists
# no packages. The foundation, a peer that a github: devDependency installs at its release tag,
# needs no setting here: pnpm guards only a git dependency below the top level (blockExoticSubdeps).
# Adapted from spike-html-apps-components (9a4392e): pnpm-workspace.yaml, with no setting left.
#
# No package is excluded from pnpm's minimum release age, its default of a day: every pin is older.
# allowBuilds lists nothing: without eslint-plugin-import-x and eslint-import-resolver-typescript,
# unrs-resolver isn't installed, and no other dependency has a build script.

# minimumReleaseAge: 0 turns off pnpm's default wait of a day before it installs a release. The
# currency task moves each pin to its latest release, and that release's notes are read before the
# bump lands, a review that stands in for the age gate; with the wait on, a frozen install of a
# lockfile that pins a release under a day old fails.
minimumReleaseAge: 0
